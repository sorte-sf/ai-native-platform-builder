<form [formGroup]="forgotForm" class="text-center justify-center mt-12">
    <mat-form-field class="w-full">
        <mat-label>{{ 'auth.email' | transloco}}</mat-label>
        <input id="forgotEmail" type="email" matInput formControlName="forgotEmail">
    </mat-form-field>

    <button class="fuse-mat-button-large w-full mt-6" mat-flat-button [color]="'primary'"
        [disabled]="!forgotForm.valid || isRequesting" (click)="sendForgotPassword()">
        <span *ngIf="!isRequesting">{{"auth.resetpassword" | transloco }}</span>
        <!-- <mat-progress-spinner *ngIf="isRequesting" [diameter]="24" [mode]="'indeterminate'"></mat-progress-spinner> -->
    </button>
</form>
