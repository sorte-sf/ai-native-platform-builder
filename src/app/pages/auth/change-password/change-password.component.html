<main class="password-page">
    <form [formGroup]="form" (ngSubmit)="submit()">
        @if (dialogRef) {
        <button type="button" class="dialog-close" (click)="dialogRef.close()"
            [attr.aria-label]="'ui.close' | transloco">×</button>
        }
        <span class="eyebrow">{{ 'ui.secure_your_workspace' | transloco }}</span>
        <h1>{{ 'ui.choose_a_new_password' | transloco }}</h1>
        <p>{{ 'ui.your_administrator_account_still_uses_the_default_password' | transloco }}</p>
        @if (auth.isBuilderWorkspaceUser()) {
        <label>Current password
            <input type="password" formControlName="currentPassword" autocomplete="current-password" required>
        </label>
        }
        <label>{{ 'ui.new_password' | transloco }}
            <input type="password" formControlName="newPassword" autocomplete="new-password">
        </label>
        <label>{{ 'ui.confirm_password' | transloco }}
            <input type="password" formControlName="confirmPassword" autocomplete="new-password">
        </label>
        @if(error){<div class="error" role="alert">{{ error | transloco }}</div>}
        <button class="submit-button" type="submit" [disabled]="form.invalid || loading">
            {{ loading ? ('ui.saving' | transloco) : ('ui.save_password' | transloco) }}
        </button>
    </form>
</main>
