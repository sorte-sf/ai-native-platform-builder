<div class="relative group">
    <button type="button"
        class="flex h-8 items-center gap-1 rounded-md border border-slate-200 bg-white px-2 text-xs font-semibold text-slate-700 shadow-sm hover:bg-slate-50 focus:outline-none"
        [attr.aria-label]="'common.language' | transloco">
        <span class="uppercase">{{ activeLang() }}</span>
        <fa-icon class="text-xs" [icon]="icons.open" aria-hidden="true"></fa-icon>
    </button>

    <div
        class="invisible absolute right-0 z-50 mt-1 w-24 rounded-md border border-slate-200 bg-white py-1 opacity-0 shadow-lg transition-all duration-200 group-hover:visible group-hover:opacity-100">
        @for (lang of availableLangs; track lang) {
        <button (click)="changeLang(lang)"
            class="block w-full px-4 py-2 text-left text-sm uppercase text-slate-700 hover:bg-slate-100"
            [class.font-bold]="lang === activeLang()">
            {{ lang }}
        </button>
        }
    </div>
</div>
