@if (signalRState$ | async; as _signalRState) {
<div class="relative flex z-20">
    <div class="rounded-full w-3 h-3 absolute"
        [ngClass]="(_signalRState === signalRState.Online ? 'animate-ping bg-green-600' : _signalRState === signalRState.Offline ? 'bg-red-500': 'bg-yellow-500')">
    </div>
    <div class="rounded-full h-3 w-3 relative"
        [ngClass]="'bg-' +(_signalRState === signalRState.Online ? 'green' : _signalRState === signalRState.Offline ? 'red': 'yellow') + '-500'">
    </div>
</div>
}
