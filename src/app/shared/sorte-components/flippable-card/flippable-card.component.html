<!-- Flippable card -->
@if (flippable) {
<!-- Front -->
<div class="antsoft-card-front">
    <ng-content select="[antsoftCardFront]"></ng-content>
</div>

<!-- Back -->
<div class="antsoft-card-back">
    <ng-content select="[antsoftCardBack]"></ng-content>
</div>
}

<!-- Normal card -->
@if (!flippable) {
<!-- Content -->
<ng-content></ng-content>

<!-- Expansion -->
@if (expanded) {
<div class="antsoft-card-expansion" [@expandCollapse]>
    <ng-content select="[antsoftCardExpansion]"></ng-content>
</div>
}
}
