@if (open) {
<div class="fixed inset-0 z-9000 bg-slate-950/20" (click)="closed.emit()"></div>
<aside
    class="fixed bottom-0 right-0 top-0 z-9010 flex w-full max-w-[380px] flex-col border-l border-slate-200 bg-white shadow-2xl">
    <header
        class="flex h-14 shrink-0 items-center bg-stone-400 text-black justify-between border-b border-slate-200 px-4">
        <div>
            <h3 class="text-sm font-bold text-slate-900">{{ 'grid.filters' | transloco }}</h3>
            <p class="text-xs text-slate-900">{{ 'grid.filtersHelp' | transloco }}</p>
        </div>
        <button
            class="grid h-9 w-9 place-items-center rounded-md border border-slate-200 bg-white text-slate-700 hover:bg-red-50 hover:text-red-600"
            type="button" (click)="closed.emit()" [attr.title]="'common.cancel' | transloco"
            [attr.aria-label]="'common.cancel' | transloco">
            <fa-icon [icon]="icons.close" aria-hidden="true"></fa-icon>
        </button>
    </header>

    <div class="min-h-0 flex-1 overflow-auto px-4 py-3">
        
         <div class="flex w-full flex-col gap-2">
            @for (column of columns; track column.field) {
            <section class="w-full">
                <div class="w-full">
                    <mat-form-field class="data-grid-filter-field !w-full" style="width: 100%;"
                        appearance="outline" subscriptSizing="dynamic">
                        <mat-label>{{column.caption | transloco}}</mat-label>
                        <input matInput class="!w-full"
                            [disabled]="columnFilterNeedsNoValue(column)" [value]="columnFilterValue(column)"
                            (input)="filterValueChanged.emit({ column, event: $event })">
                    </mat-form-field>
                </div>
            </section>
            }
        </div>

        <!-- <div class="flex w-full flex-col gap-2">
            @for (column of columns; track column.field) {
            <section class="w-full">
                <div class="w-full">
                    <mat-form-field class="data-grid-filter-field !w-full" appearance="outline"
                        subscriptSizing="dynamic">
                        <mat-label>{{column.caption | transloco}}</mat-label>
                        <input matInput class="!w-full" [disabled]="columnFilterNeedsNoValue(column)"
                            [value]="columnFilterValue(column)"
                            (input)="filterValueChanged.emit({ column, event: $event })">
                    </mat-form-field>
                </div>
            </section>
            }
        </div> -->

    </div>

    <footer
        class="flex shrink-0 items-center justify-end bg-stone-400 text-white gap-2 border-t border-slate-200 px-4 py-3">
        <button
            class="inline-flex h-9 items-center gap-2 rounded-md border border-slate-200 bg-white px-3 text-sm font-semibold text-slate-700"
            type="button" (click)="allFiltersCleared.emit()" [attr.title]="'common.clearFilters' | transloco"
            [attr.aria-label]="'common.clearFilters' | transloco">
            <fa-icon [icon]="icons.reset" aria-hidden="true"></fa-icon>
            <span>{{ 'common.clearFilters' | transloco }}</span>
        </button>

        <button class="inline-flex h-9 items-center gap-2 rounded-md bg-primary-600 px-3 text-sm font-semibold text-white hover:bg-primary-700"
            type="button" (click)="closed.emit()" [attr.title]="'common.accept' | transloco"
            [attr.aria-label]="'common.accept' | transloco">
            <fa-icon [icon]="icons.accept" aria-hidden="true"></fa-icon>
            <span>{{ 'common.accept' | transloco }}</span>
        </button>

    </footer>
</aside>
}
